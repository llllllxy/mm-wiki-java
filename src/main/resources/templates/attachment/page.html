<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1 , user-scalable=no">
    <title>MM-Wiki</title>
    <link type="favicon" rel="shortcut icon" th:href="@{/static/images/favicon.ico}"/>
    <link type="text/css" rel="stylesheet" th:href="@{/static/plugins/bootstrap/css/bootstrap.min.css}">
    <link type="text/css" rel="stylesheet" th:href="@{/static/plugins/bootstrap-table/bootstrap-table.min.css}">
    <link type="text/css" rel="stylesheet"
          th:href="@{/static/plugins/bootstrap-table/extensions/page-jump/bootstrap-table-pagejump.min.css}">
    <link type="text/css" rel="stylesheet" th:href="@{/static/font-awesome/css/font-awesome.min.css}">
    <link type="text/css" rel="stylesheet" th:href="@{/static/plugins/bootstrap-fileinput/css/fileinput.min.css}">
    <link type="text/css" rel="stylesheet" th:href="@{/static/css/common.css}">
    <script type="text/javascript" th:src="@{/static/plugins/jquery/jquery1.11.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/bootstrap/js/bootstrap.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/bootstrap-table/bootstrap-table.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/bootstrap-table/bootstrap-table-zh-CN.min.js}"></script>
    <script type="text/javascript"
            th:src="@{/static/plugins/bootstrap-table/extensions/page-jump/bootstrap-table-pagejump.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/bootstrap-fileinput/js/fileinput.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/bootstrap-fileinput/js/locales/zh.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/layer/layer.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/common/layers.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/common/ajax.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/common/common.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/common/table.js}"></script>
</head>
<body id="frame-body">
<div class="container-fluid">
    <div id="failedBox" style="margin: 0 0 6px 0"></div>
    <div class="panel panel-default">
        <div class="panel-body">
            <div class="row">
                <ul class="nav nav-tabs">
                    <li class="active"><a th:href="@{/attachment/page(document_id=${document_id})}">附件</a></li>
                    <li><a th:href="@{/attachment/image(document_id=${document_id})}">图片</a></li>
                </ul>
            </div>
        </div>
        <div class="panel-body" style="padding-bottom: 10px" th:if="${is_upload}">
            <div class="row">
                <div class="col-md-12" id="attach_section">
                    <input id="attach_upload" name="attachment" type="file">
                </div>
            </div>
        </div>
        <div class="panel-body">
            <table id="attachmentTable"></table>
        </div>
    </div>
</div>
<script type="text/javascript" th:inline="javascript">
    var documentId = /*[[${document_id}]]*/ "";
    var canDelete = /*[[${is_delete}]]*/ false;

    /**
     * 渲染普通附件操作按钮，根据权限展示删除按钮，并始终保留下载入口。
     *
     * @param value 当前字段值
     * @param row 附件行数据
     * @returns {string} 操作按钮 HTML
     */
    function attachmentActionFormatter(value, row) {
        var html = "";
        if (canDelete) {
            html += '<a data-message="确定删除附件吗？" data-url="/attachment/delete?attachment_id=' + row.attachmentId + '" onclick="Common.ajaxSubmitConfirm(this.getAttribute(\'data-message\'), this.getAttribute(\'data-url\'))"><i class="glyphicon glyphicon-trash"></i></a> ';
        }
        html += '<a href="/attachment/download?attachment_id=' + row.attachmentId + '"><i class="glyphicon glyphicon-download"></i></a>';
        return html;
    }

    $(function () {
        initTable({
            domId: "attachmentTable",
            url: "/attachment/page",
            uniqueId: "attachmentId",
            sortable: false,
            pageSize: 10,
            pageList: [10, 20, 50, 100],
            queryParams: function () {
                return {document_id: documentId};
            },
            columns: [
                {field: "name", title: "文件名"},
                {field: "username", title: "上传用户", width: "15%"},
                {field: "createTime", title: "上传时间", width: "20%"},
                {field: "operate", title: "操作", width: "11%", align: "center", formatter: attachmentActionFormatter}
            ]
        });
    });
</script>
<script th:if="${is_upload}" th:inline="javascript">
    var attachmentOption = {
        language: "zh",
        multiple: false,
        uploadUrl: "/attachment/upload",
        enctype: "multipart/form-data",
        showPreview: false,
        maxFileSize: 1024 * 500,
        uploadExtraData: {
            document_id: /*[[${document_id}]]*/ ""
        },
        msgUploadEnd: "上传完成",
        elErrorContainer: "#failedBox"
    };
    var attachmentObj = $("#attach_upload").fileinput(attachmentOption);
    attachmentObj.on("fileuploaded", function (event, data) {
        if (data.response.code === 1) {
            var redirect = data.response.redirect || {};
            var sleep = redirect.sleep !== undefined ? redirect.sleep : 2000;
            Layers.successMsg(data.response.message, sleep, function () {
                Common.redirect(redirect);
            });
        } else {
            Layers.failedMsg(data.response.message || "附件上传失败");
        }
    });
</script>
</body>
</html>
