<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1 , user-scalable=no">
    <title>MM-Wiki</title>
    <link type="favicon" rel="shortcut icon" th:href="@{/static/images/favicon.ico}"/>
    <link type="text/css" rel="stylesheet" th:href="@{/static/plugins/bootstrap/css/bootstrap.min.css}">
    <link type="text/css" rel="stylesheet" th:href="@{/static/plugins/bootstrap-table/bootstrap-table.min.css}">
    <link type="text/css" rel="stylesheet"
          th:href="@{/static/plugins/bootstrap-table/extensions/page-jump/bootstrap-table-pagejump.min.css}">
    <link type="text/css" rel="stylesheet" th:href="@{/static/css/common.css}">
    <script type="text/javascript" th:src="@{/static/plugins/jquery/jquery1.11.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/bootstrap/js/bootstrap.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/bootstrap-table/bootstrap-table.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/bootstrap-table/bootstrap-table-zh-CN.min.js}"></script>
    <script type="text/javascript"
            th:src="@{/static/plugins/bootstrap-table/extensions/page-jump/bootstrap-table-pagejump.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/plugins/layer/layer.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/common/layers.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/common/ajax.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/common/common.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/common/table.js}"></script>
</head>
<body id="frame-body">
<div class="container-fluid">
    <div class="panel panel-default">
        <div class="panel-body">
            <div class="row">
                <form id="systemContactSearchForm" role="form">
                    <div class="col-md-3">
                        <button type="button" name="add" data-link="/system/contact/add" class="btn btn-primary"><i
                                class="glyphicon glyphicon-plus"></i>添加联系人
                        </button>
                        <button type="button" name="import" data-link="/system/contact/import" class="btn btn-primary">
                            <i class="glyphicon glyphicon-import"></i>导入联系人
                        </button>
                    </div>
                    <div class="col-md-6"></div>
                    <div class="col-md-3">
                        <div class="input-group">
                            <input id="keyword" class="form-control" name="keyword" type="text" th:value="${keyword}"
                                   placeholder="姓名/职位/电话/邮箱">
                            <span class="input-group-btn">
                                <button type="button" class="btn btn-primary" onclick="reloadTable()"><i
                                        class="glyphicon glyphicon-search"></i></button>
                                <button type="button" class="btn btn-warning" onclick="resetSearchForm()"><i
                                        class="glyphicon glyphicon-repeat"></i></button>
                            </span>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="panel-body" style="padding-top: 0">
            <table id="systemContactTable"></table>
        </div>
    </div>
</div>
<script type="text/javascript" th:inline="javascript">

    function actionFormatter(value, row) {
        return '<a name="edit" data-link="/system/contact/edit?contact_id=' + row.contactId + '"><i class="glyphicon glyphicon-edit"></i>修改</a> ' +
            '<a data-message="确定删除吗？" data-url="/system/contact/delete?contact_id=' + row.contactId + '" onclick="Layers.confirm(this.getAttribute(\'data-message\'), this.getAttribute(\'data-url\'))"><i class="glyphicon glyphicon-trash"></i>删除</a>';
    }

    $(function () {
        initTable({
            domId: "systemContactTable",
            url: "/system/contact/list",
            uniqueId: "contactId",
            sortable: false,
            pageSize: 10,
            pageList: [10, 25, 50, 100],
            queryParams: function () {
                return {keyword: $("#keyword").val()};
            },
            columns: [
                {field: "contactId", title: "ID", width: "8%", align: "center"},
                {field: "name", title: "姓名", width: "15%"},
                {field: "position", title: "职位", width: "15%"},
                {field: "mobile", title: "联系电话", width: "15%", align: "center"},
                {field: "email", title: "邮箱", width: "22%"},
                {field: "operate", title: "操作", width: "15%", align: "center", formatter: actionFormatter}
            ],
            onLoadSuccess: function () {
                Layers.bindIframe("button[name='add']", "添加系统联系人", "400px", "850px");
                Layers.bindIframe("button[name='import']", "导入联系人", "500px", "1000px");
                Layers.bindIframe("[name='edit']", "修改系统联系人", "400px", "850px");
            }
        });
    });

    function reloadTable() {
        reloadTableFirstPage("systemContactTable");
    }

    function resetSearchForm() {
        resetTableSearch("systemContactSearchForm", "systemContactTable");
    }
</script>
</body>
</html>
